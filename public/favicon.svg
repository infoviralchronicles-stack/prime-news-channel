<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#pncGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#333333" stroke-width="1.5"/>
  <!-- Gold Broadsheet Top Accent -->
  <line x1="14" y1="12" x2="50" y2="12" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bold Broadsheet 'P' Serif Lettermark -->
  <text x="31" y="44" text-anchor="middle" font-family="'Times New Roman', 'Playfair Display', Georgia, serif" font-weight="900" font-size="38" fill="#ffffff">P</text>
  <!-- News Broadcast Pulse Dot (Ruby Red) -->
  <circle cx="48" cy="46" r="4.5" fill="#dc2626"/>
  <circle cx="48" cy="46" r="6" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.6"/>
</svg>